site_name: fairkl
site_description: Fairness-constrained kernel learning for Keras 3.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/keras-fairkl
repo_name: jejjohnson/keras-fairkl

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true
      include: ["*.ipynb"]

nav:
  - Home: index.md
  - Tutorials:
      - "Part 1 — Primitives & Fair Objective": notebooks/tutorial_fair_krr_part1.ipynb
      - "Part 2 — Scikit-learn & Cross-Validation": notebooks/tutorial_fair_krr_part2.ipynb
      - "Part 3 — fairkl API & Keras": notebooks/tutorial_fair_krr_part3.ipynb
      - "Part 4 — Keras Tuner": notebooks/tutorial_fair_krr_part4.ipynb
  - Examples:
      - Kernel Primitives: notebooks/primitives.ipynb
      - FairKernelRidge: notebooks/fair_kernel_ridge.ipynb
      - FairLinear: notebooks/fair_linear.ipynb
      - FairPCA: notebooks/fair_pca.ipynb
      - FairKernelPCA: notebooks/fair_kernel_pca.ipynb
      - FairModelWrapper: notebooks/fair_model_wrapper.ipynb
      - HSIC vs CKA: notebooks/hsic_vs_cka.ipynb
  - API Reference: api/reference.md
  - Changelog: CHANGELOG.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
